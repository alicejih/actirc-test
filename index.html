<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>法路祖部落研習時數 - 輔仁大學原資中心</title>
  
  <style>
    body, html {
      margin: 0; padding: 0; min-height: 100%;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background-color: #f4f7fc;
      color: #202124;
    }

    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('https://irc.fju.edu.tw/resources/20260615102746493.jpg');
      background-size: cover; background-position: center;
      filter: blur(25px) brightness(0.85); transform: scale(1.05); z-index: -2;
    }


    .main-wrapper {
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 30px 15px; box-sizing: border-box; min-height: 100vh;
    }

    .card {
      background: #ffffff; padding: 30px; border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      width: 100%; max-width: 960px; box-sizing: border-box;
    }

    /* 輸入框與按鈕 */
    input[type="text"], input[type="date"], input[type="datetime-local"], input[type="number"], select {
      width: 100%; padding: 12px 14px; margin-top: 6px;
      border: 1px solid #dadce0; border-radius: 8px; font-size: 15px;
      box-sizing: border-box; outline: none; transition: 0.2s; background: #fff;
    }
    input:focus, select:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }
    
    .btn-primary {
      background-color: #1a73e8; color: white; border: none; padding: 13px 20px;
      border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
      transition: 0.2s; text-align: center; display: inline-block;
    }
    .btn-primary:hover { background-color: #1557b0; }
    .btn-success { background-color: #1e8e3e; }
    .btn-success:hover { background-color: #137333; }
    .btn-secondary { background-color: #f1f3f4; color: #3c4043; border: 1px solid #dadce0; }
    .btn-secondary:hover { background-color: #e8eaed; }
    .btn-danger { background-color: #d93025; color: white; }
    .btn-danger:hover { background-color: #b31412; }

    /* 身分卡片 */
    .profile-bar {
      background: linear-gradient(135deg, #1a73e8, #185abc);
      color: white; padding: 22px 25px; border-radius: 12px; margin-bottom: 25px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
    }
    .profile-info h3 { margin: 0 0 6px 0; font-size: 22px; letter-spacing: 0.5px; }
    .profile-info p { margin: 0; font-size: 14px; opacity: 0.9; }
    .hours-pill {
      background: rgba(255,255,255,0.2); padding: 8px 18px; border-radius: 30px;
      font-size: 15px; font-weight: bold; backdrop-filter: blur(5px);
    }

    /* 頁籤切換 */
    .tabs-nav {
      display: flex; border-bottom: 2px solid #e8eaed; margin-bottom: 22px; gap: 10px;
    }
    .tab-btn {
      padding: 12px 20px; background: none; border: none; border-bottom: 3px solid transparent;
      font-size: 16px; font-weight: bold; color: #5f6368; cursor: pointer; transition: 0.2s;
    }
    .tab-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; }

    /* 申報清單表格 */
    .records-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .records-table th { background: #f8f9fa; padding: 12px; text-align: left; border-bottom: 2px solid #dadce0; color: #3c4043; }
    .records-table td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .badge {
      padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block;
    }
    .badge-pending { background: #fef7e0; color: #b06000; }
    .badge-approved { background: #e6f4ea; color: #137333; }
    .badge-rejected { background: #fce8e6; color: #c5221f; }

    .action-btn-sm {
      padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: bold;
      border: none; cursor: pointer; margin-right: 5px;
    }

    /* 彈窗 Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 999; display: none;
      justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;
    }
    .modal-box {
      background: #fff; width: 100%; max-width: 600px; border-radius: 14px;
      padding: 25px; max-height: 90vh; overflow-y: auto; box-sizing: border-box;
    }

    /* 質感 Toast 提示泡泡 */
    #toastBox {
      position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
      z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }
    .toast-item {
      pointer-events: auto; padding: 14px 24px; border-radius: 30px; font-size: 15px;
      font-weight: bold; box-shadow: 0 6px 20px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px;
      animation: toastSlideDown 0.3s ease-out forwards;
    }
    .toast-success { background-color: #1e8e3e; color: white; }
    .toast-error { background-color: #d93025; color: white; }
    .toast-info { background-color: #1a73e8; color: white; }

    @keyframes toastSlideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sub-nav-links {
      margin-top: 20px; text-align: center; font-size: 13px; color: #5f6368;
    }
    .sub-nav-links a {
      color: #1a73e8; text-decoration: none; margin: 0 8px; font-weight: bold;
    }
    .sub-nav-links a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .card { padding: 20px 15px; }
      .profile-bar { flex-direction: column; align-items: flex-start; }
      .records-table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>


  <!-- 浮動通知容器 -->
  <div id="toastBox"></div>

  <div class="main-wrapper">
    <!-- 1. 登入核對卡片 -->
    <div id="loginCard" class="card" style="max-width: 480px; text-align: center;">
      <h2 style="margin: 0 0 8px 0; color: #1a73e8; font-size: 24px;">法路祖部落研習時數</h2>
      <h3 style="margin: 0 0 20px 0; color: #3c4043; font-size: 18px;">學員身分認證登入</h3>
      <p style="color: #666; font-size: 14px; margin-bottom: 25px;">請輸入身分證字號與出生日期以檢視與管理您的個人研習時數</p>

      <div style="text-align: left; margin-bottom: 16px;">
        <label style="font-size: 13px; font-weight: bold; color: #444;">身分證字號</label>
        <input type="text" id="authIdNumber" placeholder="例如：A123456789" style="text-transform: uppercase;">
      </div>

      <div style="text-align: left; margin-bottom: 24px;">
        <label style="font-size: 13px; font-weight: bold; color: #444;">出生年月日 (西元)</label>
        <input type="date" id="authBirthDate">
        <small style="color: #888; font-size: 12px; margin-top: 4px; display: block;">請點選日曆選擇西元年月日</small>
      </div>

      <button id="btnLogin" class="btn-primary" style="width: 100%;" onclick="doLogin()">
        🔐 驗證身分並登入專區
      </button>

      <div class="sub-nav-links">
        <a href="query.html">🔍 免登入查詢與列印時數證明</a> ｜ 
        <a href="log.html">📝 自主登錄課程時數</a>
      </div>
    </div>

    <!-- 2. 學員個人專區 -->
    <div id="dashboardCard" class="card" style="display: none;">
      <div class="profile-bar">
        <div class="profile-info">
          <h3 id="dspStudentName">學員姓名</h3>
          <p>身分證：<span id="dspMaskedId"></span> ｜ 單位：<span id="dspUnit"></span></p>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="hours-pill">
            總研習時數：<span id="dspTotalHours" style="font-size: 20px; color: #ffe082;">0</span> 小時
          </div>
          <button class="action-btn-sm btn-secondary" onclick="doLogout()" style="background: rgba(255,255,255,0.9); color: #333;">登出</button>
        </div>
      </div>

      <div class="tabs-nav">
        <button id="tabBtn1" class="tab-btn active" onclick="switchTab(1)">📋 我的時數清單</button>
        <button id="tabBtn2" class="tab-btn" onclick="switchTab(2)">➕ 申報新時數</button>
        <button id="tabBtn3" class="tab-btn" onclick="switchTab(3)">🖨️ 列印時數證明書</button>
      </div>

      <!-- TAB 1: 申報歷史紀錄清單 -->
      <div id="tabContent1">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <span style="font-size: 15px; font-weight: bold; color: #5f6368;">目前所有研習申報紀錄</span>
          <button class="btn-primary" style="padding: 8px 14px; font-size: 13px;" onclick="refreshDashboard()">🔄 重新整理</button>
        </div>
        
        <table class="records-table">
          <thead>
            <tr>
              <th style="width: 25%;">課程名稱</th>
              <th style="width: 20%;">分類</th>
              <th style="width: 15%;">活動時間</th>
              <th style="width: 10%; text-align: right;">時數</th>
              <th style="width: 12%; text-align: center;">審核狀態</th>
              <th style="width: 18%; text-align: center;">操作</th>
            </tr>
          </thead>
          <tbody id="recordsTbody"></tbody>
        </table>
      </div>

      <!-- TAB 2: 快速申報新時數 -->
      <div id="tabContent2" style="display: none;">
        <div style="background: #e8f0fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #1967d2;">
          💡 <strong>已自動綁定學員身分：</strong><span id="formAutoName"></span> (<span id="formAutoId"></span>)，您只需填寫研習明細！
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div style="grid-column: span 2;">
            <label style="font-weight: bold; font-size: 13px;">課程或會議完整名稱：</label>
            <input type="text" id="newCourseName" placeholder="請輸入課程名稱">
          </div>
          <div>
            <label style="font-weight: bold; font-size: 13px;">課程分類 (一)：</label>
            <select id="newCat1" onchange="onCategory1Change()"><option value="">載入中...</option></select>
          </div>
          <div>
            <label style="font-weight: bold; font-size: 13px;">課程分類 (二)：</label>
            <select id="newCat2"><option value="">請先選分類(一)</option></select>
          </div>
          <div>
            <label style="font-weight: bold; font-size: 13px;">活動開始時間：</label>
            <input type="datetime-local" id="newStartTime">
          </div>
          <div>
            <label style="font-weight: bold; font-size: 13px;">活動結束時間：</label>
            <input type="datetime-local" id="newEndTime">
          </div>
          <div style="grid-column: span 2;">
            <label style="font-weight: bold; font-size: 13px;">申請研習時數：</label>
            <input type="number" id="newHours" placeholder="例如：3" step="0.5" min="0">
          </div>
          <div style="grid-column: span 2;">
            <label style="font-weight: bold; font-size: 13px;">上傳佐證圖片：</label>
            <input type="file" id="newEvidenceFile" accept="image/*">
          </div>
        </div>

        <button id="btnSubmitNew" class="btn-primary btn-success" style="margin-top: 25px; width: 100%;" onclick="submitNewRecord()">
          🚀 確認送出申請
        </button>
      </div>

      <!-- TAB 3: 列印時數證明書 -->
      <div id="tabContent3" style="display: none; text-align: center; padding: 25px 0;">
        <h3 style="color: #1a73e8; margin-bottom: 10px;">輔仁大學原住民族學生資源中心研習時數證明書</h3>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">隨時產出並匯出標準 A4 格式時數證明書</p>
        
        <div style="max-width: 360px; margin: 0 auto 25px auto; text-align: left; background: #f8f9fa; padding: 15px 20px; border-radius: 10px; border: 1px solid #dadce0;">
          <label style="font-size: 14px; font-weight: bold; color: #3c4043; display: block; margin-bottom: 6px;">📅 選擇列印研習年份：</label>
          <select id="printYearSelect" style="padding: 10px 12px; font-size: 15px;">
            <option value="">全部年份 (累計總時數)</option>
            <option value="2024">2024 年</option>
            <option value="2025">2025 年</option>
            <option value="2026">2026 年</option>
          </select>
        </div>

        <button class="btn-primary" style="padding: 14px 28px; font-size: 17px;" onclick="printCertificate()">
          🖨️ 匯出 PDF / 列印時數證明
        </button>
      </div>
    </div>
  </div>

  <!-- 修改資料彈窗 (Modal) -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
        <h3 style="margin: 0; font-size: 18px; color: #1a73e8;">✏️ 修改申報紀錄</h3>
        <button onclick="closeEditModal()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #888;">&times;</button>
      </div>
      
      <input type="hidden" id="editRecordId">
      <div style="margin-bottom: 14px;">
        <label style="font-size: 13px; font-weight: bold;">課程名稱：</label>
        <input type="text" id="editCourseName">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 14px;">
        <div>
          <label style="font-size: 13px; font-weight: bold;">分類(一)：</label>
          <select id="editCat1" onchange="onEditCategory1Change()"></select>
        </div>
        <div>
          <label style="font-size: 13px; font-weight: bold;">分類(二)：</label>
          <select id="editCat2"></select>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 14px;">
        <div>
          <label style="font-size: 13px; font-weight: bold;">開始時間：</label>
          <input type="text" id="editStartTime" placeholder="yyyy-MM-dd HH:mm">
        </div>
        <div>
          <label style="font-size: 13px; font-weight: bold;">結束時間：</label>
          <input type="text" id="editEndTime" placeholder="yyyy-MM-dd HH:mm">
        </div>
      </div>
      <div style="margin-bottom: 14px;">
        <label style="font-size: 13px; font-weight: bold;">研習時數：</label>
        <input type="number" id="editHours" step="0.5">
      </div>
      <div style="margin-bottom: 20px;">
        <label style="font-size: 13px; font-weight: bold;">重傳佐證圖片 (非必填)：</label>
        <input type="file" id="editEvidenceFile" accept="image/*">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn-secondary action-btn-sm" style="padding: 10px 18px;" onclick="closeEditModal()">取消</button>
        <button class="btn-primary action-btn-sm" id="btnSaveEdit" style="padding: 10px 18px;" onclick="saveEditedRecord()">儲存修改</button>
      </div>
    </div>
  </div>

  <!-- 客製化確認彈窗 -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal-box" style="max-width: 420px; text-align: center;">
      <h3 style="margin: 0 0 10px 0; font-size: 20px; color: #d93025;">⚠️ 確認刪除</h3>
      <p id="confirmModalText" style="color: #5f6368; font-size: 15px; line-height: 1.5; margin-bottom: 25px;"></p>
      <div style="display: flex; justify-content: center; gap: 12px;">
        <button class="btn-secondary action-btn-sm" style="padding: 10px 22px; font-size: 15px;" onclick="closeConfirmModal()">取消</button>
        <button class="btn-danger action-btn-sm" style="padding: 10px 22px; font-size: 15px;" id="btnConfirmAction">確認刪除</button>
      </div>
    </div>
  </div>

  <!-- JavaScript 核心邏輯 (支援 GitHub Pages API 連線) -->
  <script>
    let globalUser = null;
    let globalDashboardData = null;
    let categoryList = [];

    // 永久綁定正式 GAS API 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbw2bmmDg25Qa276KICvl9lB--nkDRPeUb-K7tcJ6aa3Dclr2SiZP-C3ts2JM6-zwT-H/exec";

    // 核心 API 請求函數
    async function callGasApi(action, payload = {}) {
      if (!API_URL) {
        // 模擬模式
        return mockApiResponse(action, payload);
      }
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: action, ...payload })
        });
        return await res.json();
      } catch (err) {
        throw new Error("網路連線失敗：" + err.toString());
      }
    }

    // 離線模擬資料
    function mockApiResponse(action, payload) {
      return new Promise((resolve) => {
        setTimeout(() => {
          if (action === "getCourses") {
            resolve([
              { mainCategory: "文化與族群知能", subCategories: ["原住民族傳統文化", "當代族群議題"] },
              { mainCategory: "學生輔導與陪伴", subCategories: ["學習與職涯支持", "心理與生活適應"] },
              { mainCategory: "行政與法規知能", subCategories: ["專案執行與管考", "原民政策法規"] }
            ]);
          } else if (action === "verifyUser" || action === "getDashboard") {
            resolve({
              status: "success",
              user: { name: "測試學員", idNumber: payload.idNumber || "A123456789", unit: "輔仁大學原資中心", birthDate: payload.birthDate || "19980520" },
              totalHours: 10.5,
              records: [
                { recordId: "MOCK_1", courseName: "原住民族傳統編織與文化工作坊", mainCategory: "文化與族群知能", subCategory: "原住民族傳統文化", startTime: "2026-04-15 09:00", endTime: "2026-04-15 16:30", hours: 6.5, status: "通過", canEditOrDelete: false, fileUrl: "" },
                { recordId: "MOCK_2", courseName: "大專校院原民學生生涯輔導增能會議", mainCategory: "學生輔導與陪伴", subCategory: "學習與職涯支持", startTime: "2026-05-10 13:30", endTime: "2026-05-10 17:30", hours: 4.0, status: "待審核", canEditOrDelete: true, fileUrl: "" }
              ],
              categoryOrder: { "文化與族群知能": 1, "學生輔導與陪伴": 2, "行政與法規知能": 3 }
            });
          } else if (action === "apply") {
            resolve({ status: "success", message: "【展示模式】研習時數已成功申報！" });
          } else if (action === "update") {
            resolve({ status: "success", message: "【展示模式】紀錄已成功修改！" });
          } else if (action === "delete") {
            resolve({ status: "success", message: "【展示模式】紀錄已成功撤銷！" });
          } else {
            resolve({ status: "success" });
          }
        }, 500);
      });
    }

    // === 質感 UI 提示小工具 ===
    function showToast(text, type = "info") {
      const box = document.getElementById('toastBox');
      const toast = document.createElement('div');
      toast.className = `toast-item toast-${type}`;
      let icon = "💡";
      if (type === "success") icon = "🎉";
      if (type === "error") icon = "❌";
      toast.innerHTML = `<span>${icon}</span> <span>${text}</span>`;
      box.appendChild(toast);

      setTimeout(() => {
        toast.style.transition = "opacity 0.3s, transform 0.3s";
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-15px)";
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function showConfirm(text, onConfirm) {
      document.getElementById('confirmModalText').innerText = text;
      const btn = document.getElementById('btnConfirmAction');
      btn.onclick = function() {
        closeConfirmModal();
        onConfirm();
      };
      document.getElementById('confirmModal').style.display = "flex";
    }

    function closeConfirmModal() {
      document.getElementById('confirmModal').style.display = "none";
    }

    window.onload = function() {
      const now = new Date();
      const localIso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      if (document.getElementById('newStartTime')) document.getElementById('newStartTime').value = localIso;
      if (document.getElementById('newEndTime')) document.getElementById('newEndTime').value = localIso;

      loadCategories();
    };

    async function loadCategories() {
      try {
        const data = await callGasApi("getCourses");
        if (Array.isArray(data) && data.length > 0) {
          categoryList = data;
          initCategorySelects();
        }
      } catch (err) {
        console.warn("載入分類失敗：", err);
      }
    }

    function initCategorySelects() {
      const cat1 = document.getElementById('newCat1');
      if (!cat1) return;
      cat1.innerHTML = '<option value="">-- 請選擇分類 --</option>';
      categoryList.forEach(function(item) {
        let opt = document.createElement('option');
        opt.value = item.mainCategory;
        opt.innerText = item.mainCategory;
        cat1.appendChild(opt);
      });
    }

    function onCategory1Change() {
      const cat1Val = document.getElementById('newCat1').value;
      const cat2 = document.getElementById('newCat2');
      cat2.innerHTML = "";
      if (cat1Val) {
        let matched = categoryList.find(i => i.mainCategory === cat1Val);
        if (matched && matched.subCategories.length > 0) {
          matched.subCategories.forEach(function(sub) {
            let opt = document.createElement('option');
            opt.value = sub; opt.innerText = sub;
            cat2.appendChild(opt);
          });
          return;
        }
      }
      cat2.innerHTML = '<option value="">請先選分類(一)</option>';
    }

    // 1. 執行登入核對
    async function doLogin() {
      const idNo = document.getElementById('authIdNumber').value.trim().toUpperCase();
      const bDate = document.getElementById('authBirthDate').value;
      const btn = document.getElementById('btnLogin');

      if (!idNo || !bDate) {
        showToast("請完整輸入身分證字號與出生日期！", "error");
        return;
      }

      btn.disabled = true;
      btn.innerText = "驗證中，請稍候...";

      try {
        const res = await callGasApi("getDashboard", { idNumber: idNo, birthDate: bDate });
        btn.disabled = false;
        btn.innerText = "🔐 驗證身分並登入專區";

        if (res.status !== "success") {
          showToast(res.message || "身分核對失敗！", "error");
          return;
        }

        showToast("登入成功！正在載入您的專區...", "success");
        globalUser = { ...res.user, birthDate: bDate };
        globalDashboardData = res;

        document.getElementById('loginCard').style.display = "none";
        document.getElementById('dashboardCard').style.display = "block";

        document.getElementById('dspStudentName').innerText = res.user.name + " 的時數專區";
        document.getElementById('dspMaskedId').innerText = res.user.idNumber.substring(0, 5) + "*****";
        document.getElementById('dspUnit').innerText = res.user.unit;
        document.getElementById('dspTotalHours').innerText = res.totalHours;

        document.getElementById('formAutoName').innerText = res.user.name;
        document.getElementById('formAutoId').innerText = res.user.idNumber;

        renderRecordsTable(res.records);
      } catch (err) {
        btn.disabled = false;
        btn.innerText = "🔐 驗證身分並登入專區";
        showToast("系統連線異常：" + err.toString(), "error");
      }
    }

    async function refreshDashboard() {
      if (!globalUser) return;
      try {
        const res = await callGasApi("getDashboard", { idNumber: globalUser.idNumber, birthDate: globalUser.birthDate });
        if (res.status === "success") {
          globalDashboardData = res;
          document.getElementById('dspTotalHours').innerText = res.totalHours;
          renderRecordsTable(res.records);
          showToast("資料已更新！", "success");
        }
      } catch (e) {
        showToast("更新失敗：" + e.toString(), "error");
      }
    }

    function doLogout() {
      globalUser = null;
      globalDashboardData = null;
      document.getElementById('dashboardCard').style.display = "none";
      document.getElementById('loginCard').style.display = "block";
      document.getElementById('authIdNumber').value = "";
      document.getElementById('authBirthDate').value = "";
      showToast("已安全登出！", "info");
    }

    // 3. 渲染所有歷史紀錄
    function renderRecordsTable(records) {
      const tbody = document.getElementById('recordsTbody');
      tbody.innerHTML = "";

      if (!records || records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #888; padding: 25px;">目前尚無研習時數申報紀錄</td></tr>`;
        return;
      }

      records.forEach(function(rec) {
        let tr = document.createElement('tr');
        
        let badgeClass = "badge-pending";
        if (rec.status === "通過" || rec.status === "已審核") badgeClass = "badge-approved";
        if (rec.status === "不通過") badgeClass = "badge-rejected";

        let actionHtml = "";
        if (rec.canEditOrDelete) {
          actionHtml = `
            <button class="action-btn-sm btn-primary" onclick="openEditModal('${rec.recordId}')">✏️ 修改</button>
            <button class="action-btn-sm btn-danger" onclick="deleteRecord('${rec.recordId}', '${rec.courseName}')">🗑️ 刪除</button>
          `;
        } else {
          actionHtml = `<span style="color: #999; font-size: 12px;">🔒 已審核鎖定</span>`;
        }

        let linkHtml = (rec.fileUrl && rec.fileUrl.indexOf("http") !== -1) 
          ? `<br><a href="${rec.fileUrl}" target="_blank" style="font-size: 12px; color: #1a73e8; font-weight: bold;">📷 檢視佐證</a>` 
          : "";

        tr.innerHTML = `
          <td><strong>${rec.courseName}</strong>${linkHtml}</td>
          <td>${rec.mainCategory} > ${rec.subCategory}</td>
          <td style="font-size: 13px;">${rec.startTime ? rec.startTime.split(' ')[0] : '-'}</td>
          <td style="text-align: right; font-weight: bold; color: #1a73e8;">${rec.hours}</td>
          <td style="text-align: center;"><span class="badge ${badgeClass}">${rec.status}</span></td>
          <td style="text-align: center;">${actionHtml}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 4. 頁籤切換
    function switchTab(tabIdx) {
      for (let i = 1; i <= 3; i++) {
        document.getElementById('tabBtn' + i).className = (i === tabIdx) ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tabContent' + i).style.display = (i === tabIdx) ? 'block' : 'none';
      }
    }

    // 5. 送出新申請
    async function submitNewRecord() {
      const cName = document.getElementById('newCourseName').value.trim();
      const c1 = document.getElementById('newCat1').value;
      const c2 = document.getElementById('newCat2').value;
      const sTime = document.getElementById('newStartTime').value;
      const eTime = document.getElementById('newEndTime').value;
      const hours = document.getElementById('newHours').value.trim();
      const fileInput = document.getElementById('newEvidenceFile');
      const btn = document.getElementById('btnSubmitNew');

      if (!cName || !c1 || !hours) {
        showToast("請完整填寫課程名稱、分類與申請時數！", "error");
        return;
      }

      btn.disabled = true;
      btn.innerText = "資料送出中，請稍候...";

      const combinedCat = c1 + " > " + c2;
      const formattedStart = sTime ? sTime.replace('T', ' ') : '-';
      const formattedEnd = eTime ? eTime.replace('T', ' ') : '-';

      let fileData = null;
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileData = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve({
            base64: e.target.result.split(',')[1],
            fileName: file.name,
            mimeType: file.type
          });
          reader.readAsDataURL(file);
        });
      }

      try {
        const res = await callGasApi("apply", {
          idNumber: globalUser.idNumber,
          birthDate: globalUser.birthDate,
          courseClass: combinedCat,
          courseName: cName,
          startTime: formattedStart,
          endTime: formattedEnd,
          hours: hours,
          fileData: fileData
        });

        btn.disabled = false;
        btn.innerText = "🚀 確認送出申請";

        if (res.status === "success") {
          showToast(res.message || "研習時數已成功申報！", "success");
          document.getElementById('newCourseName').value = "";
          document.getElementById('newHours').value = "";
          document.getElementById('newEvidenceFile').value = "";
          switchTab(1);
          refreshDashboard();
        } else {
          showToast(res.message, "error");
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerText = "🚀 確認送出申請";
        showToast("送出失敗：" + err.toString(), "error");
      }
    }

    // 6. 刪除紀錄
    function deleteRecord(recId, courseName) {
      showConfirm(`確定要刪除「${courseName}」這筆申報紀錄嗎？此動作無法復原。`, async function() {
        try {
          const res = await callGasApi("delete", {
            idNumber: globalUser.idNumber,
            birthDate: globalUser.birthDate,
            recordId: recId
          });
          if (res.status === "success") {
            showToast("已成功刪除該筆紀錄！", "success");
            refreshDashboard();
          } else {
            showToast(res.message, "error");
          }
        } catch (err) {
          showToast("刪除失敗：" + err.toString(), "error");
        }
      });
    }

    // 7. 開啟編輯彈窗
    function openEditModal(recId) {
      const rec = globalDashboardData.records.find(r => r.recordId === recId);
      if (!rec) return;

      document.getElementById('editRecordId').value = recId;
      document.getElementById('editCourseName').value = rec.courseName;
      document.getElementById('editStartTime').value = rec.startTime;
      document.getElementById('editEndTime').value = rec.endTime;
      document.getElementById('editHours').value = rec.hours;

      const editCat1 = document.getElementById('editCat1');
      editCat1.innerHTML = '<option value="">-- 請選擇 --</option>';
      categoryList.forEach(function(item) {
        let opt = document.createElement('option');
        opt.value = item.mainCategory; opt.innerText = item.mainCategory;
        if (item.mainCategory === rec.mainCategory) opt.selected = true;
        editCat1.appendChild(opt);
      });
      onEditCategory1Change(rec.subCategory);

      document.getElementById('editModal').style.display = "flex";
    }

    function onEditCategory1Change(defaultSub) {
      const cat1Val = document.getElementById('editCat1').value;
      const cat2 = document.getElementById('editCat2');
      cat2.innerHTML = "";
      if (cat1Val) {
        let matched = categoryList.find(i => i.mainCategory === cat1Val);
        if (matched && matched.subCategories.length > 0) {
          matched.subCategories.forEach(function(sub) {
            let opt = document.createElement('option');
            opt.value = sub; opt.innerText = sub;
            if (defaultSub && sub === defaultSub) opt.selected = true;
            cat2.appendChild(opt);
          });
          return;
        }
      }
      cat2.innerHTML = '<option value="">無子分類</option>';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = "none";
    }

    // 8. 儲存修改
    async function saveEditedRecord() {
      const recId = document.getElementById('editRecordId').value;
      const cName = document.getElementById('editCourseName').value.trim();
      const c1 = document.getElementById('editCat1').value;
      const c2 = document.getElementById('editCat2').value;
      const sTime = document.getElementById('editStartTime').value.trim();
      const eTime = document.getElementById('editEndTime').value.trim();
      const hours = document.getElementById('editHours').value.trim();
      const fileInput = document.getElementById('editEvidenceFile');
      const btn = document.getElementById('btnSaveEdit');

      if (!cName || !c1 || !hours) {
        showToast("請完整填寫課程名稱、分類與時數！", "error");
        return;
      }

      btn.disabled = true;
      btn.innerText = "儲存中...";
      const combinedCat = c1 + " > " + c2;

      let fileData = null;
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileData = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve({
            base64: e.target.result.split(',')[1],
            fileName: file.name,
            mimeType: file.type
          });
          reader.readAsDataURL(file);
        });
      }

      try {
        const res = await callGasApi("update", {
          idNumber: globalUser.idNumber,
          birthDate: globalUser.birthDate,
          recordId: recId,
          courseClass: combinedCat,
          courseName: cName,
          startTime: sTime,
          endTime: eTime,
          hours: hours,
          fileData: fileData
        });

        btn.disabled = false;
        btn.innerText = "儲存修改";

        if (res.status === "success") {
          showToast("紀錄修改成功！", "success");
          closeEditModal();
          refreshDashboard();
        } else {
          showToast(res.message, "error");
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerText = "儲存修改";
        showToast("修改失敗：" + err.toString(), "error");
      }
    }

    // 9. 列印時數證明書
    function printCertificate() {
      if (!globalDashboardData) return;
      const d = globalDashboardData;
      const selectedYear = document.getElementById('printYearSelect').value;
      const maskedId = d.user.idNumber.substring(0, 5) + "*****";
      const today = new Date();
      const dateStr = today.getFullYear() + '/' + (today.getMonth()+1) + '/' + today.getDate();

      const displayTitle = selectedYear 
        ? (selectedYear + " 年度輔仁大學原住民族學生資源中心研習時數證明書") 
        : "輔仁大學原住民族學生資源中心研習時數證明書";

      let filteredGrouped = {};
      let filteredTotalHours = 0;
      let orderMap = d.categoryOrder || {};

      d.records.forEach(function(rec) {
        let recYear = "";
        if (rec.startTime) {
          let match = rec.startTime.match(/^(\d{4})/);
          if (match) recYear = match[1];
        }

        if (selectedYear !== "" && recYear !== selectedYear) return;

        let mainCat = rec.mainCategory || "未分類";
        let subCat = (rec.subCategory === "-" || !rec.subCategory) ? mainCat : rec.subCategory;
        let h = parseFloat(rec.hours) || 0;

        if (!filteredGrouped[mainCat]) {
          filteredGrouped[mainCat] = { courses: [], subTotal: 0 };
        }
        filteredGrouped[mainCat].courses.push({
          name: rec.courseName,
          cat2Name: subCat,
          hours: h
        });
        filteredGrouped[mainCat].subTotal += h;
        filteredTotalHours += h;
      });

      filteredTotalHours = Math.round(filteredTotalHours * 10) / 10;
      for (let c in filteredGrouped) {
        filteredGrouped[c].subTotal = Math.round(filteredGrouped[c].subTotal * 10) / 10;
      }

      let sortedKeys = Object.keys(filteredGrouped).sort(function(a, b) {
        return (orderMap[a] || 999) - (orderMap[b] || 999);
      });

      let tableBodyHtml = "";
      if (sortedKeys.length === 0) {
        tableBodyHtml = `<tr><td colspan="3" style="text-align: center; color: #888; padding: 20px;">該年度內無任何研習時數紀錄</td></tr>`;
      } else {
        sortedKeys.forEach(function(categoryName) {
          tableBodyHtml += `
            <tr style="background-color: #7f7f7f !important; color: #ffffff !important; font-weight: bold;">
              <td colspan="2" style="border: 1px solid #666666; padding: 10px; color: #ffffff !important;">${categoryName}</td>
              <td style="border: 1px solid #666666; padding: 10px; text-align: right; color: #ffffff !important;">${filteredGrouped[categoryName].subTotal}</td>
            </tr>
          `;
          filteredGrouped[categoryName].courses.forEach(function(item, index) {
            tableBodyHtml += `
              <tr>
                <td style="border: 1px solid #dadce0; padding: 10px;">${item.cat2Name}</td>
                <td style="border: 1px solid #dadce0; padding: 10px;">${(index + 1)}.${item.name}</td>
                <td style="border: 1px solid #dadce0; padding: 10px; text-align: right;">${item.hours}</td>
              </tr>
            `;
          });
        });
      }

      const printHtml = `
        <!DOCTYPE html>
        <html>
        <head>
          <title>${displayTitle}_${d.user.name}</title>
          <style>
            body { font-family: "Microsoft JhengHei", Arial, sans-serif; color: #3c4043; padding: 0; margin: 0; background: #fff; }
            .print-container { width: 100%; max-width: 190mm; margin: 0 auto; padding: 10mm; box-sizing: border-box; }
            .header { border-bottom: 3px solid #1a73e8; padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
            .header h1 { margin: 0; color: #1a73e8; font-size: 24px; letter-spacing: 2px; }
            .info-table { width: 100%; margin-bottom: 20px; font-size: 15px; line-height: 1.8; }
            .main-table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; border: 1px solid #7f8c8d; }
            .main-table th { background-color: #ffffff !important; color: #202124; font-weight: bold; padding: 10px; border: 1px solid #7f8c8d; text-align: left; }
            .main-table td { padding: 8px 10px; border: 1px solid #dadce0; word-wrap: break-word; }
            .total-row { font-size: 16px; font-weight: bold; color: #1a73e8; background-color: #e8f0fe !important; }
            @page { size: A4; margin: 15mm 10mm; }
            @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
          </style>
        </head>
        <body>
          <div class="print-container">
            <div class="header">
              <h1>${displayTitle}</h1>
            </div>
            <table class="info-table">
              <tr>
                <td style="width: 50%;"><strong>學員姓名：</strong>${d.user.name}</td>
                <td style="width: 50%;"><strong>身分證字號：</strong>${maskedId}</td>
              </tr>
              <tr>
                <td><strong>服務/開課單位：</strong>${d.user.unit}</td>
                <td><strong>證明產出日期：</strong>${dateStr}</td>
              </tr>
            </table>
            <table class="main-table">
              <thead>
                <tr>
                  <th style="width: 25%;">項目</th>
                  <th style="width: 55%;">內容說明</th>
                  <th style="width: 20%; text-align: right;">時數</th>
                </tr>
              </thead>
              <tbody>
                ${tableBodyHtml}
                <tr class="total-row">
                  <td colspan="2" style="border: 1px solid #1a73e8; padding: 10px; text-align: right; padding-right: 15px;">累計總研習時數：</td>
                  <td style="border: 1px solid #1a73e8; padding: 10px; text-align: right;">${filteredTotalHours}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <script>
            window.onload = function() { setTimeout(function() { window.print(); }, 300); };
          <\/script>
        </body>
        </html>
      `;

      const printWindow = window.open('', '_blank');
      printWindow.document.open();
      printWindow.document.write(printHtml);
      printWindow.document.close();
    }
  </script>
</body>
</html>
